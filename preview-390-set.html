<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>390 preview set</title>
<style>html,body{margin:0;background:#e9eef4;font-family:sans-serif}
.frame{width:390px;margin:0 auto;background:#fff}
iframe{width:390px;height:1200px;border:0;display:block}</style>
</head><body>
<div class="frame"><iframe id="f" src="set-discount.html?v=1127d" title="390px 미리보기(세트)"></iframe></div>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function () {
  var d = f.contentDocument, w = f.contentWindow;
  var q = (location.hash || '').replace('#','');
  if (!q) return;
  var li = d.querySelector('.pitem[data-id="' + q + '"]');
  if (li) w.scrollTo(0, li.getBoundingClientRect().top + w.pageYOffset - 70);
});
</script>
</body></html>
