<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>390 preview</title>
<style>html,body{margin:0;background:#e9eef4;font-family:sans-serif}
.frame{width:390px;margin:0 auto;background:#fff}
iframe{width:390px;height:1200px;border:0;display:block}</style>
</head><body>
<div class="frame"><iframe id="f" src="index.html?v=1127d" title="390px 미리보기"></iframe></div>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function () {
  var d = f.contentDocument, w = f.contentWindow;
  var q = (location.hash || '').replace('#','');
  if (!q) return;
  var el = d.querySelector('.mopts[data-mid="' + q + '"]');
  var card = el;
  while (card && card !== d && !(card.classList && card.classList.contains('pcard'))) card = card.parentNode;
  if (card) w.scrollTo(0, card.getBoundingClientRect().top + w.pageYOffset - 80);
});
</script>
</body></html>
